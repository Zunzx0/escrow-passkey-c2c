services:
  - type: web
    name: chohanhthien
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: escrow-passkey-db
          property: connectionString
      - key: RP_NAME
        value: Escrow Passkey Marketplace
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: MOCK_PAYMENT_HMAC_SECRET
        generateValue: true

databases:
  - name: escrow-passkey-db
    region: singapore
    plan: free
    databaseName: escrow_passkey
    user: escrow_passkey
