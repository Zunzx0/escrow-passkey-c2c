services:
  - type: web
    name: choden
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_PATH
        value: data/escrow.db
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: ENABLE_HSTS
        value: "1"
      - key: MOCK_PROVIDER_CHECKOUT
        value: "1"
